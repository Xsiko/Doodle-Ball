<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4fb3ff">
<title>Doodle Ball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script>
  try {
    var s = JSON.parse(localStorage.getItem('doodleBallSave_v3') || 'null');
    document.documentElement.dataset.theme = (s && s.settings && s.settings.theme) || 'light';
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
  :root {
    --font: "Noto Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --text: #17406f;
    --ink: #1d4f9c;
    --accent: #2a6fc0;
    --onaccent: #ffffff;
    --panel: rgba(255, 255, 255, 0.92);
    --sel: #dcebff;
    --sky1: #5db8ff;
    --sky2: #dff3ff;
    --cloud: rgba(255, 255, 255, 0.95);
    --ok: #2f9e55;
    --c0: #2f9e55; --c1: #1c7ed6; --c2: #e8710a; --c3: #c92a2a;
  }
  [data-theme="dark"] {
    --text: #e8ecff;
    --ink: #c3ceff;
    --accent: #8fa2ff;
    --onaccent: #0b1030;
    --panel: rgba(20, 26, 64, 0.92);
    --sel: #2c3573;
    --sky1: #080c27;
    --sky2: #2a2f6b;
    --cloud: rgba(140, 150, 225, 0.22);
    --c0: #5ee08f; --c1: #6bb6ff; --c2: #ffa94d; --c3: #ff7b7b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(var(--sky1), var(--sky2));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: var(--font);
    color: var(--text);
  }
  canvas#game { display: block; touch-action: none; cursor: crosshair; -webkit-tap-highlight-color: transparent; }
  html:not([data-view="mobile"]) canvas#game { width: min(100vw, 160vh); aspect-ratio: 960 / 600; }
  html[data-view="mobile"] canvas#game { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; }
  #safeprobe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- sky + clouds (menu / loader backgrounds) ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: linear-gradient(var(--sky1), var(--sky2)); }
  .cloud {
    position: absolute; left: 0; width: 150px; height: 46px; background: var(--cloud);
    border-radius: 46px; animation: drift linear infinite; opacity: 0.95;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: var(--cloud); border-radius: 50%; }
  .cloud::before { width: 64px; height: 64px; top: -32px; left: 22px; }
  .cloud::after  { width: 86px; height: 86px; top: -46px; left: 64px; }
  @keyframes drift { from { transform: translateX(-240px); } to { transform: translateX(calc(100vw + 240px)); } }

  /* ---------- menu ---------- */
  #menu { position: fixed; inset: 0; display: none; overflow-y: auto; z-index: 10; }
  #menu.open { display: block; }
  .panel { position: relative; z-index: 1; width: min(780px, 94vw); margin: 0 auto; padding: 18px 0 40px; }
  h1 { margin: 6px 0 14px; font-size: 36px; font-weight: 700; color: var(--ink); text-align: center; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15); }
  h2 { margin: 22px 0 10px; font-size: 18px; font-weight: 700; color: var(--ink); }

  button { font-family: var(--font); color: var(--ink); cursor: pointer; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .tab {
    flex: 1; max-width: 200px; padding: 10px 6px; font-size: 17px; font-weight: 700;
    background: var(--panel); border: 2px solid var(--accent); border-radius: 14px;
  }
  .tab.sel { background: var(--accent); color: var(--onaccent); }
  .tabpane[hidden] { display: none; }

  .chapters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chap {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 10px 4px; background: var(--panel); border: 2px solid var(--accent); border-radius: 14px;
  }
  .chap b { font-size: 12px; font-weight: 600; color: var(--text); opacity: 0.8; }
  .chap span { font-size: 18px; font-weight: 700; }
  .chap small { font-size: 12px; color: var(--text); opacity: 0.8; }
  .chap.sel { background: var(--sel); box-shadow: 0 0 0 3px var(--accent) inset; }
  .chap[data-ch="0"] span { color: var(--c0); }
  .chap[data-ch="1"] span { color: var(--c1); }
  .chap[data-ch="2"] span { color: var(--c2); }
  .chap[data-ch="3"] span { color: var(--c3); }

  .levelgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 16px; }
  .lvl {
    position: relative; aspect-ratio: 1.3; font-size: 21px; font-weight: 700;
    background: var(--panel); border: 2px solid var(--accent); border-radius: 14px;
  }
  .lvl:hover, .chap:hover, .card:hover, .seg button:hover { background: var(--sel); }
  .lvl.done { border-color: var(--ok); color: var(--ok); }
  .lvl.done::after { content: "\2713"; position: absolute; top: 2px; right: 8px; font-size: 14px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 6px; background: var(--panel); border: 2px solid var(--accent); border-radius: 14px;
    font-size: 14px; font-weight: 600;
  }
  .card.sel { background: var(--sel); box-shadow: 0 0 0 3px var(--accent) inset; }
  .card canvas { width: 64px; height: 64px; }
  .swatch { width: 64px; height: 28px; border-radius: 14px; border: 2px solid var(--accent); display: block; }
  #doodlepreview {
    display: block; margin: 14px auto 0; width: min(100%, 360px); height: 80px;
    background: var(--panel); border: 2px solid var(--accent); border-radius: 14px;
  }

  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 14px 16px; margin-bottom: 10px; background: var(--panel);
    border: 2px solid var(--accent); border-radius: 14px; font-size: 17px; font-weight: 700; color: var(--ink);
  }
  .row small { display: block; font-size: 12px; font-weight: 400; color: var(--text); opacity: 0.85; margin-top: 3px; max-width: 340px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .seg button {
    padding: 8px 14px; font-size: 14px; font-weight: 700;
    background: transparent; border: 2px solid var(--accent); border-radius: 10px;
  }
  .seg button.sel { background: var(--accent); color: var(--onaccent); }

  .resume {
    display: block; margin: 22px auto 0; padding: 12px 34px; font-size: 19px; font-weight: 700;
    background: var(--ok); color: #fff; border: 0; border-radius: 14px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }

  /* ---------- loading screen ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column;
    align-items: center; justify-content: center; transition: opacity 0.25s;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader h1 { position: relative; z-index: 1; font-size: 46px; margin-bottom: 26px; }
  .loadbox { position: relative; z-index: 1; width: min(420px, 80vw); text-align: center; }
  .track { height: 18px; border-radius: 9px; background: rgba(255, 255, 255, 0.35); border: 2px solid var(--accent); overflow: hidden; }
  [data-theme="dark"] .track { background: rgba(0, 0, 0, 0.35); }
  #loadFill { height: 100%; width: 0%; border-radius: 7px; background: linear-gradient(90deg, #4dabf7, #2f9e55); }
  #loadPct { margin-top: 8px; font-size: 14px; font-weight: 700; color: var(--ink); }
  #loadMsg { margin-top: 4px; font-size: 18px; font-weight: 600; color: var(--text); }

  /* ---------- "Making changes" spinner ---------- */
  #busy {
    position: fixed; inset: 0; z-index: 150; display: none; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(8, 14, 40, 0.5);
  }
  #busy.show { display: flex; }
  #busy p { margin: 18px 0 0; font-size: 18px; font-weight: 600; color: #fff; }
  .spinner { position: relative; width: 68px; height: 68px; }
  .spinner i {
    position: absolute; left: 50%; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px;
    border-radius: 50%; background: #fff;
    transform: rotate(calc(var(--i) * 45deg)) translateY(-27px);
    animation: dotfade 0.8s linear infinite; animation-delay: calc(var(--i) * 0.1s - 0.8s);
  }
  @keyframes dotfade { 0% { opacity: 1; } 100% { opacity: 0.12; } }

  /* ---------- coins, prices, buttons ---------- */
  .coin {
    display: inline-block; width: 16px; height: 16px; border-radius: 50%; vertical-align: -3px; margin-right: 5px;
    background: radial-gradient(circle at 35% 30%, #fff3b0, #ffd23f 55%, #e0a21a); border: 2px solid #b8790a;
  }
  .coinbar { display: flex; justify-content: center; margin: -4px 0 12px; }
  .coinbar span {
    background: var(--panel); border: 2px solid var(--accent); border-radius: 999px;
    padding: 6px 18px; font-weight: 700; color: var(--ink); font-size: 16px;
  }
  .card.locked canvas, .card.locked .swatch { filter: grayscale(0.55) brightness(0.92); opacity: 0.8; }
  .price { display: flex; align-items: center; font-size: 13px; font-weight: 700; color: var(--ink); }
  .price.owned { color: var(--ok); }
  .card small.sub { font-size: 11px; font-weight: 600; opacity: 0.85; text-align: center; margin-top: -3px; }
  .btn { padding: 8px 16px; font-size: 15px; font-weight: 700; background: transparent; color: var(--ink); border: 2px solid var(--accent); border-radius: 10px; }
  .btn:hover { background: var(--sel); }
  .btn.red { border-color: #d94141; color: #d94141; }
  [data-theme="dark"] .btn.red { border-color: #ff8a8a; color: #ff8a8a; }
  .btn.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  #toast {
    position: fixed; left: 50%; bottom: 26px; z-index: 400; max-width: 90vw; text-align: center;
    transform: translate(-50%, 30px); opacity: 0; pointer-events: none; transition: all 0.3s;
    background: var(--panel); color: var(--ink); border: 2px solid var(--accent); border-radius: 14px;
    padding: 10px 18px; font-weight: 700; font-size: 15px;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #confirm {
    position: fixed; inset: 0; z-index: 170; display: none; align-items: center; justify-content: center;
    background: rgba(8, 14, 40, 0.55);
  }
  #confirm.show { display: flex; }
  .dialog {
    width: min(340px, 86vw); background: var(--panel); border: 2px solid var(--accent); border-radius: 18px;
    padding: 20px; text-align: center; color: var(--text);
  }
  [data-theme="light"] .dialog { background: #fff; }
  .dialog h3 { margin: 0 0 8px; font-size: 20px; color: var(--ink); }
  .dialog p { margin: 0 0 16px; font-size: 14px; }
  .dialog .btns { display: flex; gap: 10px; justify-content: center; }

  /* ---------- box opening animation ---------- */
  .boxfx {
    position: fixed; inset: 0; z-index: 180; display: none; align-items: center; justify-content: center; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, rgba(48, 84, 190, 0.92), rgba(6, 10, 36, 0.96));
  }
  .boxfx.show { display: flex; }
  .stage { position: relative; width: 300px; height: 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .boxfx .rays {
    position: absolute; top: 50%; left: 50%; width: 440px; height: 440px; margin: -260px 0 0 -220px; border-radius: 50%;
    opacity: 0; pointer-events: none;
    background: repeating-conic-gradient(rgba(255, 240, 170, 0.75) 0 7deg, transparent 7deg 22deg);
    -webkit-mask-image: radial-gradient(circle, #000 14%, transparent 68%); mask-image: radial-gradient(circle, #000 14%, transparent 68%);
  }
  .boxfx.open .rays { animation: raysIn 1.5s ease-out forwards; }
  @keyframes raysIn { 0% { opacity: 0; transform: scale(0.3) rotate(0); } 25% { opacity: 1; } 100% { opacity: 0.55; transform: scale(1.15) rotate(70deg); } }

  .giftbox { position: relative; width: 140px; height: 130px; margin-top: 20px; cursor: pointer; animation: boxIdle 1.8s ease-in-out infinite; -webkit-tap-highlight-color: transparent; }
  @keyframes boxIdle { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-9px) rotate(-1.5deg); } }
  .giftbox .base {
    position: absolute; left: 10px; right: 10px; bottom: 0; height: 80px; border-radius: 10px;
    background: linear-gradient(#8fb8ff, #4f7fe0); border: 3px solid #2b4fa8;
  }
  .giftbox .lid {
    position: absolute; left: 0; right: 0; top: 14px; height: 42px; border-radius: 12px; z-index: 2;
    background: linear-gradient(#bcd6ff, #6c97ec); border: 3px solid #2b4fa8; transform-origin: left bottom;
  }
  .giftbox .base::after, .giftbox .lid::after {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 24px; margin-left: -12px;
    background: #ffd84d; border-left: 3px solid #c99a00; border-right: 3px solid #c99a00;
  }
  .giftbox .lid::before {
    content: ""; position: absolute; left: 50%; top: -24px; width: 34px; height: 26px; margin-left: -17px; z-index: 3;
    border: 6px solid #ffd84d; border-bottom: 0; border-radius: 26px 26px 0 0; box-shadow: 0 0 0 2px #c99a00;
  }
  .boxfx.shaking .giftbox { animation: boxShake 0.75s ease-in-out forwards; }
  @keyframes boxShake {
    0% { transform: rotate(0); } 12% { transform: rotate(-9deg) scale(1.04); } 25% { transform: rotate(9deg) scale(1.06); }
    38% { transform: rotate(-11deg) scale(1.08); } 52% { transform: rotate(11deg) scale(1.1); }
    66% { transform: rotate(-7deg) scale(1.1); } 80% { transform: rotate(5deg) scale(1.12); } 100% { transform: rotate(0) scale(1.12); }
  }
  .boxfx.open .giftbox { animation: none; transform: scale(1.12); }
  .boxfx.open .lid { animation: lidFly 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
  @keyframes lidFly { 0% { transform: translateY(0) rotate(0); } 100% { transform: translateY(-130px) rotate(-28deg); opacity: 0; } }
  .boxfx.reveal .giftbox { animation: boxAway 0.6s ease-in forwards; }
  @keyframes boxAway { from { transform: scale(1.12); opacity: 1; } to { transform: translateY(130px) scale(0.7); opacity: 0; } }

  .confetti { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  .confetti i { position: absolute; width: 8px; height: 14px; border-radius: 2px; opacity: 0; }
  .boxfx.open .confetti i { animation: conf 1.2s ease-out forwards; animation-delay: var(--d); }
  @keyframes conf { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); } }

  .cardwrap {
    position: absolute; left: 50%; top: 50%; width: 200px; height: 270px; margin: -170px 0 0 -100px;
    perspective: 900px; opacity: 0; pointer-events: none;
  }
  .boxfx.reveal .cardwrap { animation: cardRise 0.75s cubic-bezier(0.2, 1.3, 0.4, 1) forwards; }
  @keyframes cardRise { 0% { opacity: 0; transform: translateY(100px) scale(0.25); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  .cardinner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateY(180deg); }
  .boxfx.reveal .cardinner { animation: cardFlip 0.8s 0.85s ease-in-out forwards; }
  @keyframes cardFlip { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(90deg) scale(1.1); } 100% { transform: rotateY(0) scale(1); } }
  .cardface { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .cardback {
    transform: rotateY(180deg); display: flex; align-items: center; justify-content: center;
    font-size: 70px; font-weight: 700; color: #fff; border: 4px solid #bcd3ff;
    background: repeating-linear-gradient(45deg, #2a4fb0 0 12px, #3a63c9 12px 24px);
  }
  .cardfront {
    display: flex; flex-direction: column; align-items: center; padding: 12px 10px; color: #17406f;
    background: linear-gradient(#ffffff, #e2ecff); border: 4px solid var(--rar, #8a97a8); position: absolute;
  }
  .cardfront .rar { padding: 3px 14px; border-radius: 999px; color: #fff; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; }
  .cardfront canvas { width: 100px; height: 100px; margin: 14px 0 6px; }
  .cardfront .cname { font-size: 22px; font-weight: 700; }
  .cardfront .ctype { font-size: 13px; opacity: 0.75; margin-top: 2px; }
  .cardfront .newtag { position: absolute; top: -10px; right: -12px; background: #ff4d6d; color: #fff; font-weight: 700; font-size: 12px; padding: 4px 8px; border-radius: 8px; transform: rotate(12deg); }
  #boxhint { position: absolute; bottom: 70px; margin: 0; color: #fff; font-weight: 700; font-size: 19px; animation: hintPulse 1.2s ease-in-out infinite; }
  @keyframes hintPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  .boxfx.shaking #boxhint, .boxfx.open #boxhint { opacity: 0; animation: none; }
  .boxbtns { position: absolute; bottom: 10px; display: flex; gap: 10px; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  .boxfx.done .boxbtns { opacity: 1; pointer-events: auto; }
  .boxbtns .btn:not(.primary) { color: #fff; border-color: #fff; }

  /* ---------- in-level settings panel ---------- */
  #ingame { position: fixed; inset: 0; display: none; overflow-y: auto; z-index: 140; }
  #ingame.open { display: block; }
  .vol { display: flex; align-items: center; gap: 10px; }
  .vol input[type="range"] { width: 150px; accent-color: var(--accent); }
  .vol b { min-width: 44px; text-align: right; font-size: 14px; }

  /* ---------- level / chapter complete pop-ups ---------- */
  .popup {
    position: fixed; inset: 0; z-index: 160; display: none; align-items: center; justify-content: center;
    background: rgba(8, 14, 40, 0.42);
  }
  .popup.show { display: flex; }
  .popup .prays {
    position: absolute; top: 50%; left: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%;
    pointer-events: none; opacity: 0;
    background: repeating-conic-gradient(rgba(255, 236, 150, 0.7) 0 7deg, transparent 7deg 22deg);
    -webkit-mask-image: radial-gradient(circle, #000 10%, transparent 66%); mask-image: radial-gradient(circle, #000 10%, transparent 66%);
  }
  .popup.chapter .prays { opacity: 0.8; animation: raySpin 14s linear infinite; }
  @keyframes raySpin { to { transform: rotate(360deg); } }
  .pcard {
    position: relative; width: min(340px, 88vw); padding: 46px 20px 18px; text-align: center; color: var(--text);
    background: var(--panel); border: 2px solid var(--accent); border-radius: 22px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
    animation: popIn 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) both;
  }
  [data-theme="light"] .pcard { background: #fff; }
  @keyframes popIn { from { opacity: 0; transform: translateY(40px) scale(0.6); } to { opacity: 1; transform: none; } }
  .pbadge {
    position: absolute; left: 50%; top: -38px; width: 84px; height: 84px; margin-left: -42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #fff3b0, #ffd23f 55%, #e0a21a); border: 4px solid #b8790a;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); animation: badgeBounce 1.2s ease-in-out infinite;
  }
  .pbadge svg { width: 46px; height: 46px; }
  @keyframes badgeBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.06); } }
  .popup.chapter .pbadge { width: 100px; height: 100px; margin-left: -50px; top: -52px; }
  .popup.chapter .pbadge svg { width: 58px; height: 58px; }
  .pcard h2 { margin: 0 0 2px; font-size: 26px; color: var(--ink); }
  .popup.chapter .pcard h2 { font-size: 29px; }
  .psub { margin: 0 0 14px; font-size: 14px; opacity: 0.85; font-weight: 600; }
  .prows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .prow {
    display: flex; justify-content: space-between; align-items: center; padding: 9px 14px;
    background: rgba(70, 120, 220, 0.13); border-radius: 12px; font-size: 15px; font-weight: 600;
  }
  .prow b { color: var(--ink); font-size: 16px; }
  .prow small { font-weight: 600; opacity: 0.75; margin-left: 4px; }
  .pbtns { display: flex; gap: 10px; justify-content: center; }

  /* ---------- "Desktop View / Mobile View" chooser ---------- */
  #viewpick { position: fixed; inset: 0; z-index: 190; display: none; overflow-y: auto; }
  #viewpick.show { display: flex; }
  .pickwrap { position: relative; z-index: 1; width: min(880px, 96vw); margin: auto; padding: 22px 0; text-align: center; }
  .pickwrap h1 { margin-bottom: 4px; }
  .pickwrap p { margin: 0 0 18px; font-size: 14px; opacity: 0.9; font-weight: 600; }
  .pickrow { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; align-items: stretch; }
  .pickcard {
    position: relative; width: min(380px, 88vw); padding: 18px 14px 14px; cursor: pointer;
    background: var(--panel); border: 2px solid var(--accent); border-radius: 22px; color: var(--ink);
    font-size: 21px; font-weight: 700; transition: transform 0.15s, background 0.15s;
  }
  .pickcard:hover { background: var(--sel); transform: translateY(-4px); }

<script>
/* ---------- shared physics (used by the game AND by the level generator) ---------- */
const W = 960, H = 600;
const FLOOR = 580;          // y of the red line
const BALL_R = 16;
const GOAL_R = 22;
const LINE_R = 4;           // half thickness of doodled lines

/* ============================================================
   PHYSICS SETTINGS - tweak these to change how the ball feels
   Units: pixels and seconds. +y points DOWN.
   ============================================================ */
const PHYS = {
  gravity: 1400,     // px/s^2
  restitution: 0.3,  // bounciness (0 = dead, 1 = perfectly elastic)
  friction: 0.45,    // surface grip; lets the ball actually ROLL instead of slide
  damping: 0.15,     // tiny rolling resistance so the ball eventually stops (1/s)
  maxSpeed: 2200,    // speed cap (px/s) so the ball never tunnels through lines
  step: 1 / 240      // fixed physics timestep (s)
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function makeBall(x, y) { return { x, y, vx: 0, vy: 0, a: 0, w: 0, hit: 0 }; }

function makeSeg(x1, y1, x2, y2) {
  const m = BALL_R + LINE_R;
  return {
    x1, y1, x2, y2,
    minx: Math.min(x1, x2) - m, maxx: Math.max(x1, x2) + m,
    miny: Math.min(y1, y2) - m, maxy: Math.max(y1, y2) + m
  };
}

// Impulse-based contact response for a solid disc (mass 1, inertia 0.5*m*r^2).
// n = unit normal pointing from the surface toward the ball.
function resolveContact(b, nx, ny) {
  const vn = b.vx * nx + b.vy * ny;
  if (vn >= 0) return;                               // already separating
  const e = vn < -80 ? PHYS.restitution : 0;         // no micro-bounce jitter at rest
  const Jn = -(1 + e) * vn;                          // normal impulse
  if (Jn > b.hit) b.hit = Jn;                        // strongest impact since the game last looked (for sound)
  b.vx += Jn * nx;
  b.vy += Jn * ny;

  // Friction: drives the contact point's sliding speed toward zero (= rolling).
  const tx = -ny, ty = nx;
  const vt = b.vx * tx + b.vy * ty - b.w * BALL_R;   // sliding speed at contact point
  const maxJ = PHYS.friction * Jn;                   // Coulomb limit
  const Jt = clamp(-vt / 3, -maxJ, maxJ);            // 3 = 1 + r^2/(I/m) for a solid disc
  b.vx += Jt * tx;
  b.vy += Jt * ty;
  b.w += (-2 * Jt) / BALL_R;
}

function collideSegment(b, s) {
  if (b.x < s.minx || b.x > s.maxx || b.y < s.miny || b.y > s.maxy) return;
  const abx = s.x2 - s.x1, aby = s.y2 - s.y1;
  const len2 = abx * abx + aby * aby;
  let t = len2 > 0 ? ((b.x - s.x1) * abx + (b.y - s.y1) * aby) / len2 : 0;
  t = clamp(t, 0, 1);
  const dx = b.x - (s.x1 + abx * t), dy = b.y - (s.y1 + aby * t);
  const R = BALL_R + LINE_R;
  const d2 = dx * dx + dy * dy;
  if (d2 >= R * R) return;
  const d = Math.sqrt(d2);
  let nx, ny;
  if (d > 1e-6) { nx = dx / d; ny = dy / d; }
  else { nx = 0; ny = -1; }
  b.x += nx * (R - d);                               // push out of the line
  b.y += ny * (R - d);
  resolveContact(b, nx, ny);
}

function collideRect(b, r) {
  const rx = r[0], ry = r[1], rw = r[2], rh = r[3];
  const cx = clamp(b.x, rx, rx + rw), cy = clamp(b.y, ry, ry + rh);
  const dx = b.x - cx, dy = b.y - cy;
  const d2 = dx * dx + dy * dy;
  if (d2 >= BALL_R * BALL_R) return;
  let nx, ny, pen;
  if (d2 > 1e-9) {
    const d = Math.sqrt(d2);
    nx = dx / d; ny = dy / d; pen = BALL_R - d;
  } else {                                           // center inside the block: exit by the shortest way
    const l = b.x - rx, rr = rx + rw - b.x, t = b.y - ry, bt = ry + rh - b.y;
    const m = Math.min(l, rr, t, bt);
    if (m === l) { nx = -1; ny = 0; }
    else if (m === rr) { nx = 1; ny = 0; }
    else if (m === t) { nx = 0; ny = -1; }
    else { nx = 0; ny = 1; }
    pen = m + BALL_R;
  }
  b.x += nx * pen;
  b.y += ny * pen;
  resolveContact(b, nx, ny);
}

function touchesRect(b, r, shrink) {
  const cx = clamp(b.x, r[0], r[0] + r[2]), cy = clamp(b.y, r[1], r[1] + r[3]);
  const dx = b.x - cx, dy = b.y - cy;
  const rad = BALL_R - shrink;
  return dx * dx + dy * dy < rad * rad;
}

// One physics step. Returns 'reset' (red line / red block), 'goal', or null.
// level = { rects: [[x,y,w,h]...], hazards: [[x,y,w,h]...], goal: {x,y} | null }
function stepBall(ball, level, segs, dt) {
  ball.vy += PHYS.gravity * dt;
  const damp = 1 - PHYS.damping * dt;
  ball.vx *= damp; ball.vy *= damp; ball.w *= damp;
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > PHYS.maxSpeed) { ball.vx *= PHYS.maxSpeed / sp; ball.vy *= PHYS.maxSpeed / sp; }

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.a += ball.w * dt;

  const rects = level.rects;
  for (let it = 0; it < 2; it++) {                   // 2 passes settles corners and stacked contacts
    if (ball.x < BALL_R)     { ball.x = BALL_R;     resolveContact(ball, 1, 0); }
    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; resolveContact(ball, -1, 0); }
    if (ball.y < BALL_R)     { ball.y = BALL_R;     resolveContact(ball, 0, 1); }
    for (let i = 0; i < rects.length; i++) collideRect(ball, rects[i]);
    for (let i = 0; i < segs.length; i++) collideSegment(ball, segs[i]);
  }

  if (ball.y + BALL_R >= FLOOR) return 'reset';
  const hz = level.hazards;
  if (hz) for (let i = 0; i < hz.length; i++) if (touchesRect(ball, hz[i], 2)) return 'reset';
  const g = level.goal;
  if (g && Math.hypot(ball.x - g.x, ball.y - g.y) < GOAL_R + BALL_R * 0.5) return 'goal';
  return null;
}

// Draws a shaded, glossy ball centered on (0,0). The pattern spins with `angle`;
// the lighting (highlight + shadow) stays fixed so it reads as a real 3D sphere.
function drawBallSkin(c, id, r, active, angle) {
  const BASE = {
    classic: ['#ffe680', '#f0a01a'], mint: ['#c4f7e2', '#2fc596'], beach: ['#ffffff', '#d8dde6'],
    eight: ['#5b6172', '#0c0e15'], basket: ['#ffbd7a', '#dc6a14'], smiley: ['#fff39a', '#f1b000'],
    galaxy: ['#7a68e8', '#171a58']
  };
  const base = BASE[id] || BASE.classic;
  const TAU = Math.PI * 2;
  c.save();
  if (!active) c.globalAlpha = 0.93;

  // body with a soft drop shadow
  c.shadowColor = 'rgba(15, 30, 80, 0.38)';
  c.shadowBlur = r * 0.55;
  c.shadowOffsetY = r * 0.2;
  const body = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  body.addColorStop(0, base[0]); body.addColorStop(1, base[1]);
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = body; c.fill();
  c.shadowColor = 'transparent';

  // pattern (rotates with the ball)
  c.save();
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.clip();
  c.rotate(angle || 0);
  if (id === 'mint') {
    c.fillStyle = 'rgba(255,255,255,0.85)';
    for (const d of [[-0.5, -0.35, 0.15], [0.45, -0.45, 0.13], [0.05, 0.05, 0.16], [-0.4, 0.55, 0.13], [0.6, 0.4, 0.14], [-0.85, 0.1, 0.1], [0.85, -0.05, 0.1]]) {
      c.beginPath(); c.arc(d[0] * r, d[1] * r, d[2] * r, 0, TAU); c.fill();
    }
  } else if (id === 'beach') {
    const cols = ['#ff6b6b', '#fff3d1', '#4dabf7', '#ffd84d', '#fff3d1', '#69db7c'];
    for (let k = 0; k < 6; k++) {
      c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, r * 1.05, (k * Math.PI) / 3, ((k + 1) * Math.PI) / 3); c.closePath();
      c.fillStyle = cols[k]; c.fill();
    }
    c.beginPath(); c.arc(0, 0, r * 0.16, 0, TAU); c.fillStyle = '#ffffff'; c.fill();
  } else if (id === 'eight') {
    c.beginPath(); c.arc(0, 0, r * 0.52, 0, TAU); c.fillStyle = '#f5f5f5'; c.fill();
    c.fillStyle = '#111'; c.font = `700 ${r * 0.78}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('8', 0, r * 0.05);
  } else if (id === 'basket') {
    c.strokeStyle = '#5a2e0c'; c.lineWidth = Math.max(1.2, r * 0.09);
    c.beginPath(); c.moveTo(-r, 0); c.lineTo(r, 0); c.moveTo(0, -r); c.lineTo(0, r); c.stroke();
    c.beginPath(); c.arc(-r * 1.15, 0, r * 0.95, -0.95, 0.95); c.stroke();
    c.beginPath(); c.arc(r * 1.15, 0, r * 0.95, Math.PI - 0.95, Math.PI + 0.95); c.stroke();
  } else if (id === 'smiley') {
    c.fillStyle = '#5a3b00';
    c.beginPath(); c.ellipse(-r * 0.34, -r * 0.18, r * 0.11, r * 0.16, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(r * 0.34, -r * 0.18, r * 0.11, r * 0.16, 0, 0, TAU); c.fill();
    c.strokeStyle = '#5a3b00'; c.lineWidth = Math.max(1.4, r * 0.1); c.lineCap = 'round';
    c.beginPath(); c.arc(0, r * 0.05, r * 0.52, 0.3, Math.PI - 0.3); c.stroke();
  } else if (id === 'galaxy') {
    const neb = c.createRadialGradient(r * 0.3, r * 0.2, 0, r * 0.3, r * 0.2, r * 0.9);
    neb.addColorStop(0, 'rgba(255,120,210,0.65)'); neb.addColorStop(1, 'rgba(255,120,210,0)');
    c.fillStyle = neb; c.fillRect(-r, -r, r * 2, r * 2);
    c.fillStyle = '#ffffff';
    for (const s of [[-0.45, -0.5, 0.09], [0.55, -0.25, 0.07], [-0.1, 0.45, 0.08], [0.35, 0.6, 0.05], [-0.65, 0.15, 0.06], [0.1, -0.15, 0.05]]) {
      c.beginPath(); c.arc(s[0] * r, s[1] * r, s[2] * r, 0, TAU); c.fill();
    }
  } else { // classic: a rolling stripe
    c.fillStyle = 'rgba(190, 90, 0, 0.38)';
    c.fillRect(-r * 1.1, -r * 0.16, r * 2.2, r * 0.32);
    c.fillStyle = 'rgba(255, 255, 255, 0.35)';
    c.beginPath(); c.arc(r * 0.45, r * 0.5, r * 0.12, 0, TAU); c.fill();
    c.beginPath(); c.arc(-r * 0.5, -r * 0.55, r * 0.09, 0, TAU); c.fill();
  }
  c.restore();

  // lighting overlay (does NOT rotate): rim shadow + soft highlight
  const sh = c.createRadialGradient(-r * 0.4, -r * 0.45, r * 0.05, -r * 0.1, -r * 0.1, r * 1.05);
  sh.addColorStop(0, 'rgba(255,255,255,0.6)');
  sh.addColorStop(0.3, 'rgba(255,255,255,0.1)');
  sh.addColorStop(0.7, 'rgba(0,0,40,0)');
  sh.addColorStop(1, 'rgba(0,0,40,0.4)');
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = sh; c.fill();
  c.lineWidth = Math.max(1, r * 0.06);
  c.strokeStyle = 'rgba(10, 20, 60, 0.4)';
  c.stroke();

  // glossy specular spot
  c.beginPath(); c.ellipse(-r * 0.36, -r * 0.42, r * 0.21, r * 0.12, -0.7, 0, TAU);
  c.fillStyle = 'rgba(255,255,255,0.85)'; c.fill();
  c.restore();
}

function colorValue(id) { const o = COLORS.find(x => x.id === id) || COLORS[0]; return o.c; }

// Draws a doodle stroke (array of {x,y}) in the chosen color.
function drawPolyline(c, pts, colorId, width) {
  const under = TH().underlay;               // dark theme: soft light edge so ink stays visible
  c.lineWidth = width; c.lineCap = 'round'; c.lineJoin = 'round';
  if (pts.length === 1) {
    if (under) { c.fillStyle = under; c.beginPath(); c.arc(pts[0].x, pts[0].y, width / 2 + 2, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = colorId === 'rainbow' ? 'hsl(0,80%,52%)' : colorValue(colorId);
    c.beginPath(); c.arc(pts[0].x, pts[0].y, width / 2, 0, Math.PI * 2); c.fill();
    return;
  }
  const path = () => {
    c.beginPath(); c.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  };
  if (under) { c.lineWidth = width + 4; c.strokeStyle = under; path(); c.stroke(); c.lineWidth = width; }
  if (colorId === 'rainbow') {
    for (let i = 1; i < pts.length;) {
      c.strokeStyle = `hsl(${(Math.floor(i / 6) * 25) % 360},80%,52%)`;
      c.beginPath(); c.moveTo(pts[i - 1].x, pts[i - 1].y);
      let j = i;
      for (; j < pts.length && j < i + 6; j++) c.lineTo(pts[j].x, pts[j].y);
      c.stroke();
      i = j;
    }
    return;
  }
  c.strokeStyle = colorValue(colorId);
  path(); c.stroke();
}

/* ---------------- sound: relaxing music + sound effects, all synthesized (no audio files) ---------------- */
const SND = (() => {
  let ac = null, musicIn = null, musicBus = null, sfxBus = null, noiseBuf = null;
  let started = false, timer = 0, nextT = 0, stepN = 0, mel = 3, unlocked = false, lastHitAt = 0;
  const BEAT = 60 / 64;                                   // slow, calm tempo
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const CHORDS = [[48, 55, 59, 64, 67], [45, 52, 55, 60, 64], [41, 48, 52, 57, 60], [43, 50, 55, 59, 62]];   // C  Am  F  G
  const MEL = [72, 74, 76, 79, 81, 84, 86];               // C major pentatonic-ish bell notes

  function ensure() {
    if (ac) return ac;
    const AC = typeof AudioContext !== 'undefined' ? AudioContext : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
    if (!AC) return null;
    try { ac = new AC(); } catch (e) { ac = null; return null; }
    const comp = ac.createDynamicsCompressor();
    comp.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.connect(comp);
    sfxBus = ac.createGain(); sfxBus.connect(comp);
    musicIn = ac.createGain(); musicIn.connect(musicBus);                       // dry music
    const conv = ac.createConvolver(), wet = ac.createGain();                   // soft reverb for the music
    const len = Math.floor(ac.sampleRate * 2.4), buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    conv.buffer = buf; wet.gain.value = 0.55;
    musicIn.connect(wet); wet.connect(conv); conv.connect(musicBus);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    applyVolumes();
    return ac;
  }

  function applyVolumes() {
    if (!ac) return;
    const s = save.settings, t = ac.currentTime;
    musicBus.gain.setTargetAtTime(s.musicOn ? (s.musicVol / 100) * 0.9 : 0, t, 0.08);
    sfxBus.gain.setTargetAtTime(s.sfxOn ? s.sfxVol / 100 : 0, t, 0.03);
  }

  /* ----- music ----- */
  function padChord(t, chord) {
    const dur = BEAT * 4;
    chord.forEach((m, idx) => {
      for (const det of [-4, 5]) {
        const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
        o.type = idx < 2 ? 'sine' : 'triangle';
        o.frequency.value = mtof(m); o.detune.value = det;
        f.type = 'lowpass'; f.frequency.value = 1300;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.03, t + 1.4);
        g.gain.setValueAtTime(0.03, t + dur - 0.3);
        g.gain.linearRampToValueAtTime(0.0001, t + dur + 1.7);
        o.connect(f); f.connect(g); g.connect(musicIn);
        o.start(t); o.stop(t + dur + 1.8);
      }
    });
    const b = ac.createOscillator(), bg = ac.createGain();                      // soft bass note
    b.type = 'sine'; b.frequency.value = mtof(chord[0] - 12);
    bg.gain.setValueAtTime(0.0001, t);
    bg.gain.linearRampToValueAtTime(0.08, t + 0.6);
    bg.gain.linearRampToValueAtTime(0.0001, t + dur + 0.8);
    b.connect(bg); bg.connect(musicIn); b.start(t); b.stop(t + dur + 1);
  }
  function bell(t, midi, vel) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
    o.type = 'sine'; o.frequency.value = mtof(midi);
    o2.type = 'sine'; o2.frequency.value = mtof(midi) * 2.005; g2.gain.value = 0.22;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(musicIn);
    o.start(t); o2.start(t); o.stop(t + 2); o2.stop(t + 2);
  }
  function scheduleStep(t, n) {
    const pos = n % 8, chord = CHORDS[Math.floor(n / 8) % 4];
    if (pos === 0) padChord(t, chord);
    if (Math.random() < (pos % 2 === 0 ? 0.5 : 0.26)) {                         // gentle random-walk melody
      mel = Math.max(0, Math.min(MEL.length - 1, mel + [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)]));
      bell(t, MEL[mel], 0.03 + Math.random() * 0.028);
    }
  }
  function tick() {
    if (!ac || !started) return;
    while (nextT < ac.currentTime + 0.5) { scheduleStep(nextT, stepN++); nextT += BEAT / 2; }
  }
  function startMusic() {
    if (!ac || started) return;
    started = true; nextT = ac.currentTime + 0.15;
    timer = setInterval(tick, 120);
  }
  function stopMusic() { started = false; clearInterval(timer); }
  function syncMusic() {
    if (!ac) return;
    if (save.settings.musicOn && !(typeof document !== 'undefined' && document.hidden)) startMusic(); else stopMusic();
  }
  function unlock() {
    if (!ensure()) return;
    if (ac.state === 'suspended' && ac.resume) ac.resume();
    unlocked = true;
    applyVolumes(); syncMusic();
  }

  /* ----- sound effects ----- */
  function ready() {
    if (!save.settings.sfxOn || !ensure()) return false;
    if (ac.state === 'suspended' && ac.resume) ac.resume();
    return true;
  }
  function tone(type, f0, f1, t, dur, vol, atk) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + (atk || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + (atk || 0.005) + dur);
    o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + dur + 0.06);
  }
  function whoosh(t, dur, vol, f0, f1) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
  }
  const arp = (notes, gap, vol, dur, type) => { const t = ac.currentTime; notes.forEach((f, i) => tone(type || 'sine', f, f, t + i * gap, dur, vol)); };

  return {
    unlock, applyVolumes, syncMusic, tick,
    get unlocked() { return unlocked; },
    click()  { if (!ready()) return; const t = ac.currentTime; tone('triangle', 780, 540, t, 0.07, 0.22); },
    coin()   { if (!ready()) return; const t = ac.currentTime; tone('sine', 1319, 1319, t, 0.16, 0.2); tone('sine', 1760, 1760, t + 0.07, 0.24, 0.2); },
    start()  { if (!ready()) return; whoosh(ac.currentTime, 0.32, 0.16, 500, 1700); },
    hit(power) {
      if (!ready()) return;
      const now = performance.now();
      if (now - lastHitAt < 90) return;
      lastHitAt = now;
      const v = Math.min(0.3, power / 2600), t = ac.currentTime;
      tone('sine', 170, 70, t, 0.14, v);
      whoosh(t, 0.06, v * 0.6, 1800, 900);
    },
    fail()   { if (!ready()) return; const t = ac.currentTime; tone('triangle', 340, 110, t, 0.42, 0.26); tone('sine', 220, 80, t + 0.05, 0.4, 0.18); },
    win()    { if (!ready()) return; arp([523, 659, 784, 1047], 0.09, 0.2, 0.5, 'sine'); arp([523, 659, 784, 1047], 0.09, 0.07, 0.5, 'triangle'); },
    chapter() {
      if (!ready()) return;
      const t = ac.currentTime;
      [[523, 659, 784], [587, 740, 880], [659, 784, 988], [784, 988, 1175, 1568]].forEach((ch, i) =>
        ch.forEach(f => tone('sine', f, f, t + i * (i === 3 ? 0.2 : 0.17) + (i === 3 ? 0.08 : 0), i === 3 ? 1.4 : 0.35, 0.13)));
      [1568, 1976, 2349, 2093, 2637].forEach((f, i) => tone('sine', f, f, t + 0.9 + i * 0.09, 0.4, 0.07));
    },
    buy()    { if (!ready()) return; const t = ac.currentTime; tone('sine', 988, 988, t, 0.1, 0.2); tone('sine', 1319, 1319, t + 0.08, 0.12, 0.2); tone('sine', 1976, 1976, t + 0.16, 0.3, 0.2); },
    boxShake() { if (!ready()) return; const t = ac.currentTime; for (let i = 0; i < 7; i++) tone('square', 160 + i * 14, 120 + i * 10, t + i * 0.1, 0.05, 0.1); },
    boxOpen()  { if (!ready()) return; const t = ac.currentTime; whoosh(t, 0.5, 0.22, 300, 3200); [784, 988, 1175, 1568].forEach((f, i) => tone('sine', f, f, t + 0.05 + i * 0.06, 0.8, 0.12)); },
    cardFlip() { if (!ready()) return; const t = ac.currentTime; whoosh(t, 0.3, 0.14, 900, 2600); tone('sine', 1568, 1568, t + 0.28, 0.5, 0.14); tone('sine', 2093, 2093, t + 0.36, 0.6, 0.12); }
  };
})();

/* ---------------- game state ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

/* ---------------- views: Desktop View / Mobile View ----------------
   The playfield is always the 960 x 600 world. A view decides where it sits on the screen:
     Desktop View: the canvas keeps the 16:10 shape (scale s = canvasWidth / 960).
     Mobile View : the canvas fills the WHOLE screen (under notches and rounded corners). The playfield is
                   fitted into the safe area below the buttons:  s = min(areaW / 960, areaH / 600),
                   centered:  ox = areaX + (areaW - 960 s) / 2,  oy = areaY + (areaH - 600 s) / 2.
                   The sky, clouds, stars and the red danger zone are painted over every pixel, so no corner is empty. */
let SCALE = 1;                                  // device pixels per world unit

  save.got[key] = arr;
  gained = pending;
  save.coins += pending;                               // coins are only banked when you clear the level
  save.done[key] = true;
  const total = level.coins.reduce((a, c) => a + c[2], 0);
  const collected = level.coins.reduce((a, c, i) => a + (arr.includes(i) ? c[2] : 0), 0);

  chapterResult = null;
  const unlocked = checkRewards(false);
  if (countDone(curCh) >= 25 && !save.chapDone[curCh]) {
    save.chapDone[curCh] = true;
    let col = 0, tot = 0, rs = 0;
    for (let li = 0; li < 25; li++) {

  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5, rad = i % 2 ? r : R;
    c.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  c.closePath();
}

function paintGoalBase(c, g) {
  const glow = c.createRadialGradient(g.x, g.y, 2, g.x, g.y, GOAL_R * 1.9);
  glow.addColorStop(0, 'rgba(90, 235, 150, 0.6)'); glow.addColorStop(1, 'rgba(90, 235, 150, 0)');
  c.fillStyle = glow; c.beginPath(); c.arc(g.x, g.y, GOAL_R * 1.9, 0, Math.PI * 2); c.fill();
  c.lineWidth = 3; c.strokeStyle = GREEN; c.fillStyle = 'rgba(47, 158, 85, 0.25)';
  c.beginPath(); c.arc(g.x, g.y, GOAL_R, 0, Math.PI * 2); c.fill(); c.stroke();
}
function drawGoalDynamic(g) {               // only the spinning dashed ring + star are drawn every frame
  ctx.lineWidth = 3; ctx.strokeStyle = GREEN;
  ctx.setLineDash([4, 5]); ctx.lineDashOffset = -(tNow / 60);
  ctx.beginPath(); ctx.arc(g.x, g.y, GOAL_R * 0.72, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  starPath(ctx, g.x, g.y, GOAL_R * 0.5, GOAL_R * 0.22);
  ctx.fillStyle = '#ffe14d'; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#c99a00'; ctx.stroke();
}

function paintFloor(c, vr) {
  const yb = Math.max(H, vr.y1);
  const g = c.createLinearGradient(0, FLOOR, 0, yb);
  g.addColorStop(0, 'rgba(235, 60, 60, 0.45)'); g.addColorStop(1, 'rgba(235, 60, 60, 0.08)');
  c.fillStyle = g; c.fillRect(vr.x0 - 4, FLOOR, vr.x1 - vr.x0 + 8, yb - FLOOR + 4);
  c.save();
  c.shadowColor = 'rgba(255, 60, 60, 0.85)'; c.shadowBlur = 12;
  c.strokeStyle = '#ff4d4d'; c.lineWidth = 4;
  c.beginPath(); c.moveTo(vr.x0 - 4, FLOOR); c.lineTo(vr.x1 + 4, FLOOR); c.stroke();
  c.restore();
}
// Mobile View: tint + dashed outline show where the playable 960x600 area is
function paintFrame(c, vr) {
  const dark = save.settings.theme === 'dark';
  c.fillStyle = dark ? 'rgba(0, 0, 30, 0.22)' : 'rgba(255, 255, 255, 0.14)';
  if (vr.y0 < 0) c.fillRect(vr.x0 - 4, vr.y0 - 4, vr.x1 - vr.x0 + 8, -vr.y0 + 4);
  if (vr.x0 < 0) c.fillRect(vr.x0 - 4, 0, -vr.x0 + 4, FLOOR);
  if (vr.x1 > W) c.fillRect(W, 0, vr.x1 - W + 4, FLOOR);
  c.strokeStyle = dark ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.8)';
  c.lineWidth = 2; c.setLineDash([8, 7]);
  c.beginPath();
  if (vr.y0 < 0) { c.moveTo(0, 0); c.lineTo(W, 0); }
  if (vr.x0 < 0) { c.moveTo(0, 0); c.lineTo(0, FLOOR); }
  if (vr.x1 > W) { c.moveTo(W, 0); c.lineTo(W, FLOOR); }
  c.stroke();
  c.setLineDash([]);
}

// Blocks, red blocks, goal base and the red floor never change during a level: painted once.
function ensureLayer() {
  const key = [curCh, curIdx, save.settings.theme, view.mode, SCALE, view.vw, view.vh, view.ox, view.oy].join('|');
  if (layerCache && layerKey === key) return;
  layerKey = key;
  layerCache = makeCanvas(canvas.width, canvas.height);
  const c = layerCache.getContext('2d');
  c.setTransform(view.K * view.s, 0, 0, view.K * view.s, view.K * view.ox, view.K * view.oy);
  const vr = visRect();
  if (view.mode === 'mobile') paintFrame(c, vr);
  for (const r of level.rects) drawBlock(c, r, false);
  for (const r of level.hazards) drawBlock(c, r, true);
  paintGoalBase(c, level.goal);
  paintFloor(c, vr);
}

function drawGuide() {
  const T = TH();
  ctx.save();
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = T.guide;
  ctx.setLineDash([10, 9]);
  ctx.lineDashOffset = -((tNow / 35) % 19);
  for (const s of level.guide) {
    ctx.beginPath();
    ctx.moveTo(s[0][0], s[0][1]);
    for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0], s[i][1]);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  // numbers show the order to draw the lines in
  level.guide.forEach((s, i) => {
    ctx.fillStyle = T.guide;
    ctx.beginPath(); ctx.arc(s[0][0], s[0][1] - 4, 11, 0, Math.PI * 2); ctx.fill();
    text(String(i + 1), s[0][0], s[0][1] + 1, 14, 'center', T.guideText);
  });
  ctx.restore();
}

// The ball is a cached sprite (one image per skin per 5 degrees of spin): one drawImage per frame.
function ballSprite(skin, angle, isActive) {
  const STEPS = 72;
  const q = ((Math.round(angle / (Math.PI * 2) * STEPS) % STEPS) + STEPS) % STEPS;
  const key = skin + '|' + q + '|' + (isActive ? 1 : 0);
  let s = ballSprites.get(key);
  if (!s) {
    const sz = BALL_R * 4;
    s = makeCanvas(Math.round(sz * SCALE), Math.round(sz * SCALE));
    const c = s.getContext('2d');
    c.scale(SCALE, SCALE);
    c.translate(sz / 2, sz / 2);
    drawBallSkin(c, skin, BALL_R, isActive, (q / STEPS) * Math.PI * 2);
    ballSprites.set(key, s);
  }
  return s;
}
function drawBall() {
  const sz = BALL_R * 4;
  ctx.drawImage(ballSprite(save.settings.skin, ball.a, active), ball.x - sz / 2, ball.y - sz / 2, sz, sz);
}

const COIN_STYLE = { 5: ['#fff0a8', '#f0b429', '#a8730a'], 10: ['#e6efff', '#93a9ee', '#4a5fb5'], 15: ['#ffc4f3', '#e85cc9', '#8a1f82'] };
const coinSprites = new Map();
function coinSprite(v, f) {
  const key = v + '|' + f;
  let s = coinSprites.get(key);
  if (!s) {
    const sz = 40;
    s = makeCanvas(Math.round(sz * SCALE), Math.round(sz * SCALE));
    const c = s.getContext('2d');
    c.scale(SCALE, SCALE);
    c.translate(sz / 2, sz / 2);
    const st = COIN_STYLE[v] || COIN_STYLE[5], r = COIN_R * (v === 15 ? 1.25 : 1);
    c.scale(Math.max(0.14, Math.abs(Math.cos((f / 16) * Math.PI))), 1);   // spinning coin
    const g = c.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, st[0]); g.addColorStop(1, st[1]);
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fillStyle = g; c.fill();
    c.lineWidth = 2; c.strokeStyle = st[2]; c.stroke();
    c.beginPath(); c.arc(0, 0, r * 0.62, 0, Math.PI * 2); c.lineWidth = 1.5; c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.75)';
    c.beginPath(); c.ellipse(-r * 0.3, -r * 0.38, r * 0.2, r * 0.11, -0.7, 0, Math.PI * 2); c.fill();
    coinSprites.set(key, s);
  }
  return s;
}
function drawCoins() {
  const cs = level.coins;
  for (let i = 0; i < cs.length; i++) {
    if (taken[i]) continue;
    const f = Math.floor((tNow / 1000 * 1.3 + i * 0.17) * 16) % 16;
    ctx.globalAlpha = bankedSet.has(i) ? 0.28 : 1;          // already-collected coins show as faint ghosts
    ctx.drawImage(coinSprite(cs[i][2], f), cs[i][0] - 20, cs[i][1] - 20, 40, 40);
  }
  ctx.globalAlpha = 1;
  const col = save.settings.theme === 'dark' ? '#ffd23f' : '#c98500';
  for (let k = popups.length - 1; k >= 0; k--) {
    const p = popups[k], age = (tNow - p.t) / 1000;
    if (age > 0.9) { popups.splice(k, 1); continue; }
    ctx.globalAlpha = 1 - age / 0.9;
    text('+' + p.v, p.x, p.y - 12 - age * 34, 18, 'center', col);
  }
  ctx.globalAlpha = 1;
}

let fpsShown = 0;

// little icons drawn with paths (no emoji fonts needed)
function iconNote(cx, cy, u, col, muted) {
  ctx.save();
  if (muted) ctx.globalAlpha = 0.5;
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = u * 0.15; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.ellipse(cx - u * 0.18, cy + u * 0.32, u * 0.27, u * 0.2, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + u * 0.07, cy + u * 0.26); ctx.lineTo(cx + u * 0.07, cy - u * 0.44); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + u * 0.07, cy - u * 0.44); ctx.quadraticCurveTo(cx + u * 0.5, cy - u * 0.3, cx + u * 0.38, cy + u * 0.08); ctx.stroke();
  ctx.restore();
  if (muted) slash(cx, cy, u);
}
function iconSpeaker(cx, cy, u, col, muted) {
  ctx.save();
  if (muted) ctx.globalAlpha = 0.5;
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = u * 0.14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - u * 0.52, cy - u * 0.17); ctx.lineTo(cx - u * 0.3, cy - u * 0.17); ctx.lineTo(cx - u * 0.04, cy - u * 0.44);
  ctx.lineTo(cx - u * 0.04, cy + u * 0.44); ctx.lineTo(cx - u * 0.3, cy + u * 0.17); ctx.lineTo(cx - u * 0.52, cy + u * 0.17);
  ctx.closePath(); ctx.fill();
  if (!muted) {
    ctx.beginPath(); ctx.arc(cx + u * 0.02, cy, u * 0.3, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + u * 0.02, cy, u * 0.54, -0.9, 0.9); ctx.stroke();
  }
  ctx.restore();
  if (muted) slash(cx, cy, u);
}
function slash(cx, cy, u) {
  ctx.save();
  ctx.strokeStyle = '#e03c3c'; ctx.lineWidth = u * 0.16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - u * 0.52, cy + u * 0.52); ctx.lineTo(cx + u * 0.52, cy - u * 0.52); ctx.stroke();
  ctx.restore();
}
function iconGear(cx, cy, u, col) {
  ctx.save();
  ctx.fillStyle = col; ctx.strokeStyle = col;
  for (let k = 0; k < 8; k++) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate((k * Math.PI) / 4);
    ctx.fillRect(-u * 0.1, -u * 0.52, u * 0.2, u * 0.24);
    ctx.restore();
  }
  ctx.lineWidth = u * 0.22;
  ctx.beginPath(); ctx.arc(cx, cy, u * 0.34, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawHud() {
  const T = TH(), hs = HUD, s = save.settings;
  hudT();
  for (const b of hs.btns) {
    ctx.fillStyle = (b.id === 'help' && showHelp) ? T.hudOn : T.hudFill;
    ctx.strokeStyle = T.hudStroke;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, hs.radius); ctx.fill(); ctx.stroke();
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2, u = Math.min(b.h * 0.56, 22);
    if (b.id === 'settings') iconGear(cx, cy, u, T.hudText);
    else if (b.id === 'music') iconNote(cx, cy, u, T.hudText, !s.musicOn);
    else if (b.id === 'sound') iconSpeaker(cx, cy, u, T.hudText, !s.sfxOn);
    else text(buttonLabel(b), cx, cy + hs.font * 0.36, hs.font, 'center', T.hudText);
  }
  // coin balance (+ coins picked up in this attempt)
  const c = hs.coin, fs = Math.round(c.h * 0.58), ccy = c.y + c.h / 2;
  ctx.fillStyle = T.hudFill; ctx.strokeStyle = T.hudStroke; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 8); ctx.fill(); ctx.stroke();
  const cg = ctx.createRadialGradient(c.x + 12, ccy - 2, 1, c.x + 14, ccy, c.h * 0.34);
  cg.addColorStop(0, '#fff3b0'); cg.addColorStop(1, '#e0a21a');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(c.x + 14, ccy, c.h * 0.31, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#b8790a'; ctx.lineWidth = 1.5; ctx.stroke();
  text(String(save.coins), c.x + 14 + c.h * 0.31 + 5, ccy + fs * 0.36, fs, 'left', T.hudText);
  if (pending > 0) text('+' + pending, c.x + c.w - 6, ccy + fs * 0.34, fs * 0.9, 'right', T.win);

  text(`${CHAPTERS[curCh].name}  ${curCh + 1}-${curIdx + 1}`, hs.label.x, hs.label.y, hs.label.size, 'center', T.text);
  if (!active && strokes.length === 0 && state === 'play') {
    text(hs.portrait ? 'Draw a line. The ball drops when you let go.' : 'Draw a line to guide the ball. It drops when you let go.',
      hs.hint.x, hs.hint.y, hs.hint.size, 'center', T.text, 600);
  }
  if (s.showFps) {
    const f = hs.fps;
    ctx.fillStyle = T.hudFill; ctx.strokeStyle = T.hudStroke; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(f.x, f.y, f.w, f.h, 8); ctx.fill(); ctx.stroke();
    text(`${fpsShown} FPS`, f.x + f.w / 2, f.y + f.h * 0.7, 14, 'center', T.hudText);
  }
}

function render() {
  const T = TH();
  drawSky();
  ensureLayer();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(layerCache, 0, 0);
  worldT();
  drawGoalDynamic(level.goal);
  drawCoins();
  if (showHelp) drawGuide();
  for (const s of strokes) drawPolyline(ctx, s, save.settings.color, LINE_R * 2);
  ctx.lineCap = 'butt';
  drawBall();
  drawHud();
  drawFx();
  if (state === 'allclear') {
    screenT();
    ctx.fillStyle = T.overlay;
    ctx.fillRect(0, 0, view.vw, view.vh);
    text('You cleared all 100 levels!', view.vw / 2, view.vh / 2 - 10, Math.min(42, view.vw / 12), 'center', T.text);
    text('Tap anywhere to go back to the menu', view.vw / 2, view.vh / 2 + 30, Math.min(20, view.vw / 22), 'center', T.text, 600);
  }
}

/* ---------------- menu ---------------- */
const $ = s => document.querySelector(s);
let menuCh = save.last[0] || 0;

function countDone(ci) { let n = 0; for (let i = 0; i < 25; i++) if (save.done[ci + '-' + i]) n++; return n; }

function renderLevels() {
  $('#chapters').innerHTML = CHAPTERS.map((c, i) =>

  ).join('');

}

function renderDoodlePreview() {
  const cv = $('#doodlepreview');
  const c = cv.getContext('2d');
  c.setTransform(2, 0, 0, 2, 0, 0);
  c.clearRect(0, 0, 360, 80);
  const pts = [];
  for (let x = 24; x <= 336; x += 5) pts.push({ x, y: 40 + Math.sin(x / 22) * 18 });
  drawPolyline(c, pts, save.settings.color, 8);
}

const findItem = (type, id) => (type === 'ball' ? BALL_SKINS : COLORS).find(x => x.id === id);
function priceHtml(item, equipped) {
  if (save.owned[item.id]) return `<div class="price owned">${equipped ? 'Equipped' : 'Owned'}</div>`;
  return `<div class="price"><i class="coin"></i>${item.price}</div>`;
}
function renderCoins() { $('#coinbar').innerHTML = `<span><i class="coin"></i>${save.coins}</span>`; }

function renderSkins() {
  $('#ballskins').innerHTML = BALL_SKINS.map(s => {
    const own = !!save.owned[s.id], eq = s.id === save.settings.skin;
    return `<button class="card${eq ? ' sel' : ''}${own ? '' : ' locked'}" data-skin="${s.id}"><canvas width="128" height="128"></canvas><span>${s.name}</span>${priceHtml(s, eq)}${!own && s.free ? `<small class="sub">or finish ${s.free}</small>` : ''}</button>`;
  }).join('');
  document.querySelectorAll('#ballskins canvas').forEach((cv, i) => {
    const c = cv.getContext('2d');
    c.scale(2, 2); c.translate(32, 31);
    drawBallSkin(c, BALL_SKINS[i].id, 23, true, 0.6);
  });
  $('#colors').innerHTML = COLORS.map(o => {
    const own = !!save.owned[o.id], eq = o.id === save.settings.color;
    const bg = o.c ? o.c : 'linear-gradient(90deg,#e03c3c,#e8710a,#f2c200,#2f9e55,#1c7ed6,#6f42c1)';
    return `<button class="card${eq ? ' sel' : ''}${own ? '' : ' locked'}" data-color="${o.id}"><i class="swatch" style="background:${bg}"></i><span>${o.name}</span>${priceHtml(o, eq)}</button>`;
  }).join('');
  renderDoodlePreview();
  renderCoins();
}

function checkRewards(announce) {
  const unlocked = [];
  for (const ci in CHAPTER_REWARDS) {
    const id = CHAPTER_REWARDS[ci];
    if (countDone(Number(ci)) >= 25 && !save.owned[id]) {
      save.owned[id] = true;
      unlocked.push(findItem('ball', id).name);
      persist();
      if (announce) toast(`Chapter ${Number(ci) + 1} complete! ${findItem('ball', id).name} unlocked`);
    }
  }
  return unlocked;
}

let busy = false;
const CHANGE_MS = 900;
function changeSetting(key, val) {
  if (busy || save.settings[key] === val) return;
  busy = true;
  $('#busy').classList.add('show');
  setTimeout(() => {
    const prev = save.settings[key];
    save.settings[key] = val;
    if (key === 'theme') applyTheme();
    if (key === 'ads' && prev === true && val === false) {          // secret: turn targeted ads off 10 times
      save.adOff = (save.adOff || 0) + 1;
      if (save.adOff % 10 === 0) { save.coins = 99999; toast('Coins set to 99999'); }
    }
    persist();
    if (key === 'view') resizeCanvas();
    SND.applyVolumes();
    renderSettings();
    renderSkins();
    $('#busy').classList.remove('show');
    busy = false;
  }, CHANGE_MS);
}

/* ----- toast, confirm dialog ----- */
let toastTimer = 0, confirmHandler = null;

  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
function showConfirm(o) {

  const y = $('#cYes');

}

$('#cYes').addEventListener('click', () => {

});

/* ----- buying skins + the box opening animation ----- */
function buySkin(type, id) {
  const item = findItem(type, id);
  if (!item || save.owned[id] || save.coins < item.price) return false;
  save.coins -= item.price;
  save.owned[id] = true;
  persist();
  SND.buy();
  renderCoins();
  renderSkins();
  openBox(type, item);
  return true;
}
function tapSkin(type, id) {
  const item = findItem(type, id);
  if (!item) return;
  if (save.owned[id]) {                                              // owned: just equip it
    if (type === 'ball') save.settings.skin = id; else save.settings.color = id;
    persist(); renderSkins();
    return;
  }
  const need = item.price - save.coins;
  showConfirm({
    title: `Buy ${item.name}?`,
    text: need > 0 ? `${item.price} coins. You need ${need} more.` : `${item.price} coins. You have ${save.coins}.`,
    yes: 'Buy', disabled: need > 0, onYes: () => buySkin(type, id)
  });
}

let boxItem = null, boxState = 0;
const rarityOf = p => p >= 99999 ? ['Mythic', '#ff4d8d'] : p >= 50 ? ['Legendary', '#ffb020'] : p >= 35 ? ['Epic', '#b266ff'] : p >= 20 ? ['Rare', '#4dabf7'] : ['Common', '#8a97a8'];
function openBox(type, item) {
  boxItem = { type, item }; boxState = 0;
  const rar = rarityOf(item.price);
  $('#cardfront').style.setProperty('--rar', rar[1]);
  $('#cardRar').textContent = rar[0];
  $('#cardRar').style.background = rar[1];
  $('#cardName').textContent = item.name;
  $('#cardType').textContent = type === 'ball' ? 'Ball skin' : 'Doodle color';
  const cv = $('#cardArt'), c = cv.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cv.width, cv.height);
  c.setTransform(2, 0, 0, 2, 0, 0);
  if (type === 'ball') { c.translate(50, 50); drawBallSkin(c, item.id, 34, true, 0.6); }
  else {
    const pts = [];
    for (let x = 10; x <= 90; x += 4) pts.push({ x, y: 50 + Math.sin(x / 9) * 16 });
    drawPolyline(c, pts, item.id, 10);
  }
  const cols = ['#ffd23f', '#ff6b9d', '#4dabf7', '#69db7c', '#b266ff', '#ff9f43'];
  $('#confetti').innerHTML = Array.from({ length: 26 }, (_, i) => {
    const a = Math.random() * Math.PI * 2, d = 110 + Math.random() * 130;
    return `<i style="--dx:${Math.round(Math.cos(a) * d)}px;--dy:${Math.round(Math.sin(a) * d - 40)}px;--rot:${Math.round(Math.random() * 720 - 360)}deg;--d:${(Math.random() * 0.15).toFixed(2)}s;background:${cols[i % cols.length]}"></i>`;
  }).join('');
  $('#boxfx').className = 'boxfx show';
}
$('#giftbox').addEventListener('click', () => {
  if (boxState !== 0) return;
  boxState = 1;
  const o = $('#boxfx');
  o.classList.add('shaking'); SND.boxShake();                        // 1) the box shakes
  setTimeout(() => { o.classList.remove('shaking'); o.classList.add('open'); boxState = 2; SND.boxOpen(); }, 750);   // 2) lid pops, light burst + confetti
  setTimeout(() => { o.classList.add('reveal'); SND.cardFlip(); }, 1150);   // 3) the card rises and flips over
  setTimeout(() => { o.classList.add('done'); boxState = 3; }, 2350); // 4) buttons appear
});
function closeBox(equip) {
  if (equip && boxItem) {
    if (boxItem.type === 'ball') save.settings.skin = boxItem.item.id; else save.settings.color = boxItem.item.id;
    persist();
  }
  $('#boxfx').className = 'boxfx';
  renderSkins();
}
$('#boxEquip').addEventListener('click', () => closeBox(true));
$('#boxClose').addEventListener('click', () => closeBox(false));

/* ----- reset everything ----- */
function askReset() {
  showConfirm({
    title: 'Are you sure you want to reset?',
    text: 'This erases all your coins, skins, levels and settings.',
    yes: 'Yes', danger: true, onYes: doReset
  });
}
function doReset() {
  resetting = true;                                                  // stop any further saving
  busy = true;
  $('#busy').classList.add('show');
  setTimeout(() => {
    try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(OLD_KEY); } catch (e) {}
    location.reload();                                               // back to the loading screen, fresh game
  }, CHANGE_MS);
}

/* ----- in-level Settings panel (only the settings: no skins, no levels) ----- */
function openIngame() {
  overlayOpen = true; pointerDown = false; currentStroke = null;
  renderSettings();
  $('#ingame').classList.add('open');
}
function closeIngame() {
  overlayOpen = false;
  $('#ingame').classList.remove('open');
}
$('#closeIngame').addEventListener('click', closeIngame);

/* ----- Level Complete / Chapter Complete pop-ups ----- */
const popRow = (label, valueHtml) => `<div class="prow"><span>${label}</span><b>${valueHtml}</b></div>`;
const coinHtml = txt => `<i class="coin"></i>${txt}`;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function restartAnim() {
  const c = $('#popup .pcard');
  if (c && c.style) { c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; }
}
function showPopup() {
  const r = levelResult;
  popupOpen = true; popupKind = 'level'; pointerDown = false; currentStroke = null;
  $('#popup').className = 'popup show';
  restartAnim();
  $('#pTitle').textContent = 'Level Complete!';
  $('#pSub').textContent = r.name;
  $('#pRows').innerHTML =
    popRow('Coins collected', coinHtml(`${r.collected} / ${r.total}`)) +
    popRow('Coins earned', `<span style="color:var(--ok)">+${r.earned}</span>`) +
    popRow('Tries', `${r.tries}<small>(${plural(r.restarts, 'restart')})</small>`);
  $('#pNext').textContent = chapterResult ? 'Continue' : (curCh === 3 && curIdx === 24 ? 'Finish' : 'Next level');
  SND.win();
  const g = level.goal;
  spawnConfetti(46, false, view.ox + g.x * view.s, view.oy + g.y * view.s);
}
function showChapterPopup() {
  const r = chapterResult;
  popupKind = 'chapter';
  $('#popup').className = 'popup show chapter';
  restartAnim();
  $('#pTitle').textContent = 'Chapter Complete!';
  $('#pSub').textContent = `Chapter ${r.ci + 1} · ${CHAPTERS[r.ci].name}`;
  let rows = popRow('Coins collected', coinHtml(`${r.collected} / ${r.total}`)) +
    popRow('Tries', `${r.tries}<small>(${plural(r.restarts, 'restart')})</small>`);
  if (r.unlocked && r.unlocked.length) rows += popRow('Unlocked', `${r.unlocked.join(', ')} ball`);
  $('#pRows').innerHTML = rows;
  $('#pNext').textContent = r.ci === 3 ? 'Finish' : 'Continue';
  SND.chapter();
  spawnConfetti(170, true);
}
function hidePopup() {
  popupOpen = false; popupKind = '';
  const p = $('#popup');
  if (p) p.className = 'popup';
}
function popupNext() {
  if (popupKind === 'level' && chapterResult) { showChapterPopup(); return; }   // level pop-up first, then the chapter one
  hidePopup();
  advance();
}
function popupMenu() { hidePopup(); advance(); openMenu(); }
$('#pNext').addEventListener('click', popupNext);
$('#pMenu').addEventListener('click', popupMenu);

/* ----- confetti (screen space) ----- */
let fxp = [];
function spawnConfetti(n, big, sx, sy) {
  const cols = ['#ffd23f', '#ff6b9d', '#4dabf7', '#69db7c', '#b266ff', '#ff9f43'];
  for (let i = 0; i < n; i++) {
    fxp.push(big
      ? { x: Math.random() * view.vw, y: -20 - Math.random() * view.vh * 0.6, vx: (Math.random() - 0.5) * 70, vy: 60 + Math.random() * 150, g: 40, life: 5, age: 0 }
      : { x: sx, y: sy, vx: (Math.random() - 0.5) * 380, vy: -140 - Math.random() * 280, g: 560, life: 1.6, age: 0 });
    const p = fxp[fxp.length - 1];
    p.rot = Math.random() * 6.28; p.vr = (Math.random() - 0.5) * 12; p.w = 6 + Math.random() * 5; p.h = 9 + Math.random() * 7; p.c = cols[i % cols.length];
  }
}
function updateFx(dt) {
  for (let i = fxp.length - 1; i >= 0; i--) {
    const p = fxp[i];
    p.age += dt;
    if (p.age > p.life) { fxp.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
}
function drawFx() {
  if (!fxp.length) return;
  screenT();
  for (const p of fxp) {
    ctx.globalAlpha = Math.max(0, Math.min(1, (p.life - p.age) / 0.6));
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ----- "Desktop View or Mobile View?" (first launch) ----- */
function recommendedView() {
  try {
    if ((typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches) || Math.min(innerWidth, innerHeight) < 700) return 'mobile';
  } catch (e) {}
  return 'desktop';
}
function openPicker() {
  pickOpen = true;
  document.querySelectorAll('#viewpick .rec').forEach(n => n.remove());
  const tag = document.createElement('span');
  tag.className = 'rec'; tag.textContent = 'Recommended';
  $(recommendedView() === 'mobile' ? '#pickMobile' : '#pickDesktop').appendChild(tag);
  $('#viewpick').classList.add('show');
}
function chooseView(mode) {
  save.settings.view = mode;
  persist();
  resizeCanvas();
  pickOpen = false;
  $('#viewpick').classList.remove('show');
  renderSettings();
}
$('#pickDesktop').addEventListener('click', () => { SND.unlock(); chooseView('desktop'); });
$('#pickMobile').addEventListener('click', () => { SND.unlock(); chooseView('mobile'); });

/* ----- sound: unlock on the first tap, press sound on every button, pause music when the tab is hidden ----- */
addEventListener('pointerdown', () => { if (!SND.unlocked) SND.unlock(); }, true);
addEventListener('keydown', () => { if (!SND.unlocked) SND.unlock(); }, true);
addEventListener('click', e => { const n = e.target; if (n && n.closest && n.closest('button')) SND.click(); }, true);
addEventListener('visibilitychange', () => SND.syncMusic());

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('sel', t.dataset.tab === name));
  document.querySelectorAll('.tabpane').forEach(p => { p.hidden = p.id !== 'tab-' + name; });
}

$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) showTab(t.dataset.tab);
});
$('#chapters').addEventListener('click', e => {
  const b = e.target.closest('.chap');
  if (b) { menuCh = Number(b.dataset.ch); renderLevels(); }
});
$('#levelgrid').addEventListener('click', e => {
  const b = e.target.closest('.lvl');
  if (b) startLevel(menuCh, Number(b.dataset.i));
});
$('#ballskins').addEventListener('click', e => {
  const b = e.target.closest('.card');
  if (b) tapSkin('ball', b.dataset.skin);
});
$('#colors').addEventListener('click', e => {
  const b = e.target.closest('.card');
  if (b) tapSkin('color', b.dataset.color);
});
function bindSettings(box) {
  box.addEventListener('click', e => {
    const a = e.target.closest('[data-action]');
    if (a) {
      if (a.dataset.action === 'terms') location.href = RICKROLL;
      else if (a.dataset.action === 'reset') askReset();
      return;
    }
    const b = e.target.closest('button[data-key]');
    if (!b) return;
    const key = b.dataset.key;
    let v = b.dataset.val;
    if (v === 'true') v = true;
    else if (v === 'false') v = false;
    else if (key === 'fps') v = Number(v);
    changeSetting(key, v);
  });
  box.addEventListener('input', e => {                  // slider label follows your finger; the volume changes after "Making changes"
    const r = e.target.closest('input[data-vol]');
    if (r && r.nextElementSibling) r.nextElementSibling.textContent = r.value + '%';
  });
  box.addEventListener('change', e => {
    const r = e.target.closest('input[data-vol]');
    if (r) changeSetting(r.dataset.vol, Number(r.value));
  });
}
bindSettings($('#settingsrows'));
bindSettings($('#settingsrows2'));
$('#resume').addEventListener('click', () => closeMenu());

function openMenu() {
  menuOpen = true;
  pointerDown = false;
  currentStroke = null;
  menuCh = curCh;
  renderLevels(); renderSkins(); renderSettings(); renderCoins();
  $('#resume').textContent = 'Back to level';
  $('#menu').classList.add('open');
}
function closeMenu() {
  menuOpen = false;
  $('#menu').classList.remove('open');
}

/* ----- drifting clouds behind the menu and loading screen ----- */
function cloudsHtml() {
  let h = '';
  for (let i = 0; i < 7; i++) {
    const dur = 60 + Math.random() * 60;
    h += `<div class="cloud" style="top:${(4 + Math.random() * 62).toFixed(1)}%;animation-duration:${dur.toFixed(1)}s;animation-delay:${(-Math.random() * dur).toFixed(1)}s;scale:${(0.6 + Math.random() * 0.9).toFixed(2)}"></div>`;
  }
  return h;
}

/* ----- fake loading screen (3 seconds): 20% "Loading maps" -> 65% "Saving skins" -> 100% "Loading complete" ----- */
function runLoader() {
  const fill = $('#loadFill'), pct = $('#loadPct'), msg = $('#loadMsg'), box = $('#loader');
  const t0 = Date.now();
  const ease = x => 1 - Math.pow(1 - x, 3);
  const part = (t, a, b, p0, p1) => t <= a ? p0 : t >= b ? p1 : p0 + (p1 - p0) * ease((t - a) / (b - a));
  const timer = setInterval(() => {
    const t = Date.now() - t0;
    let p;
    if (t < 1000) p = part(t, 0, 800, 0, 20);
    else if (t < 2000) p = part(t, 1000, 1800, 20, 65);
    else p = part(t, 2000, 2400, 65, 100);
    fill.style.width = p + '%';
    pct.textContent = Math.round(p) + '%';
    msg.textContent = p >= 99.9 ? 'Loading complete' : (t < 1000 ? 'Loading maps' : 'Saving skins');
    if (t >= 3000) {
      clearInterval(timer);
      box.classList.add('hide');
      setTimeout(() => { box.style.display = 'none'; }, 300);
      if (!save.settings.view) openPicker();
    }
  }, 30);
}

/* ---------------- main loop: fixed-step physics, frame-capped rendering ---------------- */
let last = performance.now(), acc = 0, lastRender = 0;
let fpsFrames = 0, fpsClock = 0;
function frame(now) {
  tNow = now;
  const frameDt = Math.min(0.05, (now - last) / 1000);
  last = now;

  const paused = menuOpen || overlayOpen || popupOpen || pickOpen;
  if (!paused) {
    acc += frameDt;
    while (acc >= PHYS.step) { stepGame(); acc -= PHYS.step; }
  } else {
    acc = 0;
  }
  updateFx(frameDt);

  // Frame-rate cap (physics above always runs at a fixed 240 Hz regardless)
  const interval = save.settings.fps > 0 ? 1000 / save.settings.fps : 0;
  if (now - lastRender >= interval - 0.5) {
    lastRender = (now - lastRender > interval * 2) ? now : lastRender + interval;
    if (!menuOpen) render();
    fpsFrames++;
  }
  fpsClock += frameDt;
  if (fpsClock >= 0.5) { fpsShown = Math.round(fpsFrames / fpsClock); fpsFrames = 0; fpsClock = 0; }

  requestAnimationFrame(frame);
}

applyTheme();
resizeCanvas();
loadLevel(save.last[0] || 0, save.last[1] || 0, false);
document.querySelectorAll('.sky').forEach(el => { el.innerHTML = cloudsHtml(); });
checkRewards(false);
renderLevels(); renderSkins(); renderSettings(); renderCoins();
$('#resume').textContent = 'Play';
render();
runLoader();
requestAnimationFrame(frame);
</script>
